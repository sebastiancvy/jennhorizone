
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Login - JennHorizone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div class="container d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="card p-4 shadow-sm" style="width:360px">
      <h4 class="mb-3">Acceso JennHorizone</h4>
      <form id="loginForm">
        <div class="mb-2">
          <input id="username" class="form-control" placeholder="Usuario" required>
        </div>
        <div class="mb-3">
          <input id="password" type="password" class="form-control" placeholder="Contraseña" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Entrar</button>
      </form>
    </div>
  </div>
<script src="js/app.js"></script>
</body>
</html>
