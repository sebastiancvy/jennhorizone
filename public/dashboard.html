
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Dashboard - JennHorizone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">JennHorizone</a>
    <div>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Pacientes</h3>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">Agregar Paciente</button>
  </div>

  <div class="table-responsive">
    <table class="table table-hover">
      <thead class="table-secondary">
        <tr>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Enfermedad</th>
          <th>Próxima cita</th>
          <th>Observaciones</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="pacientesTable"></tbody>
    </table>
  </div>
</div>

<!-- Modal Agregar/Editar -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <form id="addPacienteForm" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Paciente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="pacienteId">
        <div class="row">
          <div class="col-md-6 mb-2"><input id="nombre" class="form-control" placeholder="Nombre" required></div>
          <div class="col-md-6 mb-2"><input id="apellido" class="form-control" placeholder="Apellido" required></div>
        </div>
        <div class="mb-2"><input id="enfermedad" class="form-control" placeholder="Enfermedad"></div>
        <div class="mb-2"><input id="cita" type="date" class="form-control"></div>
        <div class="mb-2"><textarea id="observaciones" class="form-control" placeholder="Observaciones"></textarea></div>

        <div class="mb-2">
          <label class="form-label">Imágenes (puedes subir varias)</label>
          <input id="imagenesInput" type="file" accept="image/*" multiple class="form-control">
        </div>

        <div class="mb-2">
          <label class="form-label">Videos (opcional)</label>
          <input id="videosInput" type="file" accept="video/*" multiple class="form-control">
        </div>

        <div id="previewArea" class="mt-2"></div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
