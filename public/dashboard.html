
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>🩺 Panel JennHorizone</h1>

<h2>Agregar paciente</h2>

<form id="formPaciente" class="grid">
  <input placeholder="Nombre" id="nombre" required>
  <input placeholder="Apellido" id="apellido">
  <input placeholder="Teléfono" id="telefono">
  <input placeholder="Enfermedad" id="enfermedad">
  <input placeholder="Próxima cita" id="cita">
  <textarea placeholder="Observaciones" id="obs"></textarea>

  <button type="submit">Guardar</button>
</form>

<hr>

<h2>Pacientes</h2>
<ul id="lista"></ul>

<script src="app.js"></script>

</body>
</html>
